<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⚡ Power X Hub · Obfuscator v1 (fixed)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #090b11; color: #e2e8f0;
    min-height: 100vh; display: flex; justify-content: center;
    align-items: center; padding: 20px;
}
.container { width: 100%; max-width: 980px; }
.card {
    background: linear-gradient(145deg, #141823, #0d1019);
    border-radius: 28px; padding: 34px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.8), 0 0 0 1px rgba(0,255,183,0.07);
}
.header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.header .icon { font-size: 34px; }
.header h1 {
    font-size: 25px; font-weight: 700;
    background: linear-gradient(135deg, #00ffb7, #00b894);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header .tag {
    margin-left: auto; background: rgba(0,255,183,0.08);
    color: #00ffb7; font-size: 11px; font-weight: 600;
    padding: 5px 14px; border-radius: 30px;
    border: 1px solid rgba(0,255,183,0.15);
    text-transform: uppercase; letter-spacing: 0.8px;
}
.alert {
    padding: 12px 18px; border-radius: 14px;
    background: rgba(0,255,183,0.05);
    border: 1px solid rgba(0,255,183,0.15);
    color: #00ffb7; font-size: 13px; font-weight: 500;
    display: none; align-items: center; gap: 10px;
    margin-bottom: 20px;
}
.alert.show { display: flex; }
.alert.error {
    background: rgba(255,71,87,0.07);
    border-color: rgba(255,71,87,0.2); color: #ff6b7a;
}
.field { margin-bottom: 20px; }
.field label {
    display: block; font-size: 13px; font-weight: 600;
    color: #b6c2d4; margin-bottom: 7px;
}
.field label .emoji { margin-right: 6px; }
textarea {
    width: 100%; padding: 13px 16px;
    background: #0b0e16; border: 1px solid #232d3e;
    border-radius: 12px; color: #dce4f0;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px; line-height: 1.5; resize: vertical;
}
textarea:focus { outline: none; border-color: #00ffb7; }
textarea[readonly] { background: #080b12; color: #8b9bb0; }
.char-counter { text-align: right; font-size: 11px; color: #4a5a6e; margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 20px; }
.btn {
    flex: 1 1 150px; padding: 14px 20px; border: none;
    border-radius: 12px; font-weight: 700; font-size: 14px;
    cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; gap: 8px;
    transition: all 0.2s ease; background: #1f2937; color: #e2e8f0;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.btn-primary { background: linear-gradient(135deg, #00ffb7, #00b380); color: #0a0c12; }
.btn-primary:hover { box-shadow: 0 8px 30px rgba(0,255,183,0.3); }
.btn-outline { background: transparent; border: 1px solid #334155; color: #cbd5e1; }
.btn-outline:hover { background: #1e293b; border-color: #00ffb7; }
.footer {
    margin-top: 24px; text-align: center; font-size: 12px;
    color: #3d4a5e; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 20px;
}
@media (max-width: 650px) {
    .card { padding: 22px 14px; }
    .header h1 { font-size: 19px; }
    .btn { flex: 1 1 100%; }
    .header .tag { display: none; }
}
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <span class="icon">⚡</span>
            <h1>Power X Hub</h1>
            <span class="tag">Obfuscator v1 · fixed</span>
        </div>
        <div id="alert" class="alert">
            <span id="alertIcon">✅</span>
            <span id="alertMsg">Pronto!</span>
        </div>
        <div class="field">
            <label><span class="emoji">📄</span> Código Original Luau</label>
            <textarea id="srcCode" rows="8" placeholder="-- Cole seu script aqui..."></textarea>
            <div class="char-counter"><span id="charCount">0</span> caracteres</div>
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="compilar()">
                <span>🚀</span> Ofuscar
            </button>
            <button class="btn btn-outline" onclick="copiarOfuscado()">
                <span>📋</span> Copiar Código
            </button>
            <button class="btn btn-outline" onclick="limpar()">
                <span>🧹</span> Limpar
            </button>
        </div>
        <div class="field">
            <label><span class="emoji">🔐</span> Código Ofuscado (Luau válido — roda direto)</label>
            <textarea id="outCode" rows="14" readonly placeholder="O código ofuscado aparecerá aqui..."></textarea>
            <div class="char-counter"><span id="outCount">0</span> caracteres</div>
        </div>
        <div class="footer">
            🔒 Ofuscação 100% local · Sem <code>loadstring</code> · Luau válido direto
        </div>
    </div>
</div>
<script>
function makeRNG(seed) {
    let s = seed >>> 0;
    if (s === 0) s = 1;
    return function () {
        s ^= s << 13; s >>>= 0;
        s ^= s >>> 17;
        s ^= s << 5;  s >>>= 0;
        return s;
    };
}
function makeNameGen(seed) {
    const rng = makeRNG(seed);
    const used = new Set();
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_";
    return function () {
        let name, tries = 0;
        do {
            name = "_";
            const len = 6 + (rng() % 6);
            for (let i = 0; i < len; i++) name += chars[rng() % chars.length];
            tries++;
        } while (used.has(name) && tries < 100);
        if (used.has(name)) name = name + "_" + used.size;
        used.add(name);
        return name;
    };
}
function tokenize(code) {
    const tokens = [];
    let i = 0;
    const n = code.length;
    const isIdStart = c => /[A-Za-z_]/.test(c);
    const isId = c => /[A-Za-z0-9_]/.test(c);
    const isDigit = c => /[0-9]/.test(c);
    while (i < n) {
        const c = code[i];
        if (/\s/.test(c)) {
            let j = i;
            while (j < n && /\s/.test(code[j])) j++;
            tokens.push({ t: 'ws', v: code.slice(i, j) });
            i = j; continue;
        }
        if (c === '-' && code[i + 1] === '-') {
            let j = i + 2;
            let level = 0;
            if (code[j] === '[') {
                let k = j + 1;
                while (code[k] === '=') { level++; k++; }
                if (code[k] === '[') {
                    const close = ']' + '='.repeat(level) + ']';
                    let end = code.indexOf(close, k + 1);
                    if (end === -1) end = n; else end += close.length;
                    tokens.push({ t: 'comment', v: code.slice(i, end) });
                    i = end; continue;
                }
            }
            let end = i;
            while (end < n && code[end] !== '\n') end++;
            tokens.push({ t: 'comment', v: code.slice(i, end) });
            i = end; continue;
        }
        if (c === '[') {
            let k = i + 1;
            let level = 0;
            while (code[k] === '=') { level++; k++; }
            if (code[k] === '[') {
                const close = ']' + '='.repeat(level) + ']';
                let end = code.indexOf(close, k + 1);
                if (end === -1) end = n; else end += close.length;
                const content = code.slice(k + 1, end - close.length);
                tokens.push({ t: 'str', v: content, q: 'long' });
                i = end; continue;
            }
        }
        if (c === '"' || c === "'") {
            const q = c;
            let j = i + 1, val = "";
            while (j < n) {
                if (code[j] === '\\') {
                    val += code[j] + (code[j + 1] || '');
                    j += 2; continue;
                }
                if (code[j] === q) { j++; break; }
                val += code[j];
                j++;
            }
            tokens.push({ t: 'str', v: val, q });
            i = j; continue;
        }
        if (isDigit(c) || (c === '.' && isDigit(code[i + 1]))) {
            let j = i;
            while (j < n && /[0-9a-fA-FxX._]/.test(code[j])) j++;
            tokens.push({ t: 'num', v: code.slice(i, j) });
            i = j; continue;
        }
        if (isIdStart(c)) {
            let j = i;
            while (j < n && isId(code[j])) j++;
            tokens.push({ t: 'id', v: code.slice(i, j) });
            i = j; continue;
        }
        const two = code.slice(i, i + 2);
        const ops2 = ['==', '~=', '<=', '>=', '..', '->', '::', '//', '<<', '>>'];
        if (ops2.includes(two)) {
            tokens.push({ t: 'op', v: two });
            i += 2; continue;
        }
        tokens.push({ t: 'op', v: c });
        i++;
    }
    return tokens;
}
function unescapeLuaString(s) {
    let out = '';
    for (let i = 0; i < s.length; i++) {
        if (s[i] === '\\' && i + 1 < s.length) {
            const n = s[i + 1];
            if (n === 'n') { out += '\n'; i++; continue; }
            if (n === 't') { out += '\t'; i++; continue; }
            if (n === 'r') { out += '\r'; i++; continue; }
            if (n === '\\' || n === '"' || n === "'") { out += n; i++; continue; }
            if (n === 'a') { out += '\x07'; i++; continue; }
            if (n === 'b') { out += '\b'; i++; continue; }
            if (n === 'f') { out += '\f'; i++; continue; }
            if (n === 'v') { out += '\v'; i++; continue; }
            if (/[0-9]/.test(n)) {
                let j = i + 1, num = '';
                while (j < s.length && /[0-9]/.test(s[j]) && num.length < 3) { num += s[j]; j++; }
                out += String.fromCharCode(parseInt(num, 10) & 0xFF);
                i = j - 1; continue;
            }
            if (n === 'x' && i + 3 < s.length) {
                const hex = s.slice(i + 2, i + 4);
                if (/[0-9a-fA-F]{2}/.test(hex)) {
                    out += String.fromCharCode(parseInt(hex, 16));
                    i += 3; continue;
                }
            }
            out += s[i];
        } else {
            out += s[i];
        }
    }
    return out;
}
function ofuscar(code) {
    if (!code.trim()) throw new Error("Código vazio.");
    const tokens = tokenize(code);
    let seed = 7;
    for (let i = 0; i < code.length; i++) seed = (Math.imul(seed, 31) + code.charCodeAt(i)) >>> 0;
    if (seed === 0) seed = 1;
    const rng = makeRNG(seed);
    const novoNome = makeNameGen(seed ^ 0x9E3779B9);
    const RESERVED = new Set([
        'and','break','do','else','elseif','end','false','for','function','if','in',
        'local','nil','not','or','repeat','return','then','true','until','while',
        'continue','type','export','typeof','self',
        'game','workspace','script','Instance','Vector3','Vector2','CFrame','Color3',
        'BrickColor','UDim','UDim2','Enum','Ray','Region3','NumberRange','NumberSequence',
        'ColorSequence','Rect','TweenInfo','Faces','Axes','PhysicalProperties','Random',
        'task','wait','spawn','delay','tick','time','print','warn','error','assert',
        'pcall','xpcall','select','tostring','tonumber','setmetatable','getmetatable',
        'rawget','rawset','rawequal','rawlen','next','pairs','ipairs','unpack',
        'table','string','math','os','io','coroutine','bit32','utf8','debug','bit',
        'loadstring','load','require','getfenv','setfenv','getgenv','getrenv',
        'Players','LocalPlayer','Character','CharacterAdded','WaitForChild','Parent',
        'Connect','new','FindFirstChild','GetService','Name','UserId','PlayerGui',
        'Backpack','Camera','CurrentCamera','Humanoid','Head','Torso','RootPart',
        'Position','Size','Transparency','CanCollide','Anchored','Material','Color',
        'Value','Enabled','Visible','Text','Image','Mouse','Keyboard','UserInputService',
        'TweenService','Debris','ReplicatedStorage','ServerStorage','ServerScriptService',
        'StarterGui','StarterPack','Lighting','SoundService','Chat','Teams',
        'TeleportService','DataStoreService','MarketplaceService','HttpService',
        'PathfindingService','CollectionService','ContextActionService','GuiService',
        'RunService','Heartbeat','RenderStepped','Stepped','Clone','Destroy',
        'GetChildren','GetDescendants','IsA','FindFirstChildOfClass','GetAttribute',
        'SetAttribute','Changed','AncestryChanged','ChildAdded','ChildRemoved',
        'Touched','TouchEnded','GetMouse','GetPlayers','GetPlayerFromCharacter',
        'CharacterRemoving','Chatted','Kick','LoadCharacter','FireServer','OnServerEvent',
        'OnClientEvent','InvokeServer','Fire','Disconnect','Wait','Once',
        'IsDescendantOf','GetFullName','insert','remove','find','sort','concat',
        'create','pack','clear','byte','char','format','gmatch','gsub','len','lower',
        'match','rep','reverse','sub','upper','split','abs','acos','asin','atan',
        'atan2','ceil','clamp','cos','deg','exp','floor','fmod','huge','log','max',
        'min','modf','noise','pi','pow','rad','random','randomseed','round','sign',
        'sin','sqrt','tan','clock','date','difftime','resume','running',
        'status','wrap','yield','arshift','band','bnot','bor','btest','bxor',
        'extract','lrotate','lshift','replace','rrotate','rshift','Workspace'
    ]);
    const mapa = new Map();
    let prevSignificant = null;
    for (const tk of tokens) {
        if (tk.t === 'ws' || tk.t === 'comment') continue;
        if (tk.t === 'id') {
            const isProperty = prevSignificant && prevSignificant.t === 'op' && (prevSignificant.v === '.' || prevSignificant.v === ':');
            if (!isProperty && !RESERVED.has(tk.v) && !mapa.has(tk.v)) {
                mapa.set(tk.v, novoNome());
            }
        }
        prevSignificant = tk;
    }
    function numOfuscado(n) {
        const a = (rng() % 300) + 1;
        const b = a + n;
        return '(' + b + '-' + a + ')';
    }
    function strOfuscada(raw) {
        const s = unescapeLuaString(raw);
        if (s.length === 0) return '""';
        const key = (rng() % 200) + 20;
        const rot = (rng() % 5) + 1;
        const bytes = [];
        for (let i = 0; i < s.length; i++) {
            let v = s.charCodeAt(i) & 0xFF;
            v = (v + key) & 0xFF;
            v = ((v << rot) | (v >>> (8 - rot))) & 0xFF;
            bytes.push(v);
        }
        const tn = novoNome();
        const rn = novoNome();
        const kn = novoNome();
        const iname = novoNome();
        const vn = novoNome();
        return '(function()'
            + ' local ' + tn + '={' + bytes.join(',') + '};'
            + ' local ' + rn + '={};'
            + ' local ' + kn + '=' + numOfuscado(key) + ';'
            + ' for ' + iname + '=1,#' + tn + ' do'
            + ' local ' + vn + '=' + tn + '[' + iname + '];'
            + ' ' + vn + '=bit32.bor(bit32.rshift(' + vn + ',' + numOfuscado(rot) + '),bit32.lshift(' + vn + ',' + numOfuscado(8 - rot) + '));'
            + ' ' + vn + '=bit32.band(' + vn + '-' + kn + ',255);'
            + ' ' + rn + '[' + iname + ']=string.char(' + vn + ');'
            + ' end;'
            + ' return table.concat(' + rn + ');'
            + ' end)()';
    }
    const lines = [];
    lines.push('-- [[ Power X Hub v1 · fixed ]]');
    lines.push('local bit32 = bit32 or bit');
    let out = '';
    prevSignificant = null;
    for (let i = 0; i < tokens.length; i++) {
        const tk = tokens[i];
        if (tk.t === 'comment') continue;
        if (tk.t === 'ws') { out += tk.v; continue; }
        if (tk.t === 'str') { out += strOfuscada(tk.v); prevSignificant = tk; continue; }
        if (tk.t === 'num') {
            const num = parseFloat(tk.v);
            const isPlainInt = !isNaN(num) && num === Math.floor(num) && Math.abs(num) < 10000 && !/[xX.]/.test(tk.v);
            if (isPlainInt) out += numOfuscado(num);
            else out += tk.v;
            prevSignificant = tk; continue;
        }
        if (tk.t === 'id') {
            const isProperty = prevSignificant && prevSignificant.t === 'op' && (prevSignificant.v === '.' || prevSignificant.v === ':');
            if (!isProperty && mapa.has(tk.v) && tk.v !== 'self') out += mapa.get(tk.v);
            else out += tk.v;
            prevSignificant = tk; continue;
        }
        out += tk.v;
        prevSignificant = tk;
    }
    lines.push(out);
    for (let d = 0; d < 3; d++) {
        const dn = novoNome();
        lines.push('if false then local ' + dn + '=' + numOfuscado(rng() % 1000) + ' end');
    }
    return lines.join('\n');
}
const alertDiv = document.getElementById('alert');
const alertIcon = document.getElementById('alertIcon');
const alertMsg  = document.getElementById('alertMsg');
const srcCode   = document.getElementById('srcCode');
const outCode   = document.getElementById('outCode');
const charCount = document.getElementById('charCount');
const outCount  = document.getElementById('outCount');
srcCode.addEventListener('input', () => charCount.textContent = srcCode.value.length);
function mostrarAlerta(msg, tipo, tempo) {
    if (tipo === undefined) tipo = 'info';
    if (tempo === undefined) tempo = 5000;
    alertDiv.className = 'alert show';
    alertIcon.textContent = tipo === 'error' ? '❌' : '✅';
    alertMsg.textContent = msg;
    if (tipo === 'error') alertDiv.classList.add('error');
    else alertDiv.classList.remove('error');
    clearTimeout(window._alertTimer);
    if (tempo > 0) window._alertTimer = setTimeout(function(){ alertDiv.className = 'alert'; }, tempo);
}
function compilar() {
    const codigo = srcCode.value;
    if (!codigo.trim()) return mostrarAlerta('Cole um script primeiro.', 'error');
    try {
        const out = ofuscar(codigo);
        outCode.value = out;
        outCount.textContent = out.length;
        mostrarAlerta('✅ Ofuscado com sucesso!', 'info', 5000);
    } catch (e) {
        mostrarAlerta('Erro: ' + e.message, 'error');
    }
}
function copiarOfuscado() {
    if (!outCode.value) return mostrarAlerta('Nada para copiar.', 'error');
    navigator.clipboard.writeText(outCode.value).then(function(){
        mostrarAlerta('📋 Copiado!', 'info', 3000);
    }).catch(function(){ mostrarAlerta('Falha ao copiar.', 'error'); });
}
function limpar() {
    srcCode.value = '';
    outCode.value = '';
    charCount.textContent = '0';
    outCount.textContent = '0';
    alertDiv.className = 'alert';
}
srcCode.value = '-- Exemplo\nlocal player = game.Players.LocalPlayer\nprint("Hello, " .. player.Name)';
charCount.textContent = srcCode.value.length;
</script>
